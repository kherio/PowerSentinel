name: Apply PowerSentinel daemon phase 1

on:
  push:
    paths:
      - '.github/phase1-trigger'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply phase 1 refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('system/bin/PowerSentineld')
          s = p.read_text()
          old = 'conf="/data/local/tmp/PowerSentinel/PowerSentinel.conf"\ndeclare -a active_events'
          new = 'conf="/data/local/tmp/PowerSentinel/PowerSentinel.conf"\n. "$(dirname "$0")/PowerSentinel-config.sh"\ndeclare -a active_events'
          if old not in s:
              raise SystemExit('expected daemon header not found')
          s = s.replace(old, new, 1)
          start = s.index('getconf() {')
          end = s.index('\n}\n\nis_device()', start) + 2
          s = s[:start] + '''getconf() {\n  # Compatibility wrapper: callers keep the existing interface while all\n  # global reads go through the centralized configuration cache.\n  config_get "$1" "${2-}"\n}''' + s[end:]
          old = '''get_night_times() {\n  night_start=$(grep -F -A99 "night={" "$conf" 2>/dev/null | grep '^\\s*night_start=' | head -1 | cut -d= -f2 | tr -d ' \\r')\n  night_end=$(grep -F -A99 "night={" "$conf" 2>/dev/null | grep '^\\s*night_end=' | head -1 | cut -d= -f2 | tr -d ' \\r')\n}'''
          new = '''get_night_times() {\n  night_start="$(config_get_event_raw night night_start "")"\n  night_end="$(config_get_event_raw night night_end "")"\n}'''
          if old not in s:
              raise SystemExit('night parser block not found')
          s = s.replace(old, new, 1)
          old = '''get_thermal_threshold() {\n  thermal_threshold=$(grep -F -A99 "thermal={" "$conf" 2>/dev/null | grep '^\\s*thermal_threshold=' | head -1 | cut -d= -f2 | tr -d ' \\r')\n}'''
          new = '''get_thermal_threshold() {\n  thermal_threshold="$(config_get_event_raw thermal thermal_threshold "")"\n}'''
          if old not in s:
              raise SystemExit('thermal parser block not found')
          s = s.replace(old, new, 1)
          old = 'echo "ctl_file=$ctl_file" "$conf-v2"'
          if old not in s:
              raise SystemExit('migration ctl_file line not found')
          s = s.replace(old, 'echo "ctl_file=$ctl_file" >> "$conf-v2"', 1)
          needle = '''# check for migration\nversion="$(getconf version 1)" # if version is not set, it is 1'''
          repl = '''# Load the top-level configuration once. Event-specific values are parsed\n# separately when their event is evaluated.\nconfig_load_global\n\n# check for migration\nversion="$(getconf version 1)" # if version is not set, it is 1'''
          if needle not in s:
              raise SystemExit('startup config section not found')
          s = s.replace(needle, repl, 1)
          old = '''  migrate\nfi\n\n# setup logging'''
          new = '''  migrate\n  config_load_global\n  version="$(getconf version 1)"\nfi\n\n# setup logging'''
          if old not in s:
              raise SystemExit('migration reload section not found')
          s = s.replace(old, new, 1)
          old = '''until [ "$resume" = "resume" ] || [ $(getconf safemode 0) = "0" ]; do\n    resume=$(cat "$ctl_file")'''
          new = '''until [ "$resume" = "resume" ] || [ "$(config_get safemode 0)" = "0" ]; do\n    config_load_global\n    resume=$(cat "$ctl_file")'''
          if old not in s:
              raise SystemExit('safemode loop not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          bash -n system/bin/PowerSentineld
          bash -n system/bin/PowerSentinel-config.sh

          rm -f .github/phase1-trigger .github/workflows/phase1-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/bin/PowerSentineld .github/phase1-trigger .github/workflows/phase1-refactor.yml
          git diff --cached --check
          git commit -m 'refactor(daemon): centralize configuration access'
          git push
