name: Build PowerSentinel release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build module package
        shell: bash
        run: |
          set -euo pipefail
          rm -f PowerSentinel-v3.7.1.zip
          zip -r -9 PowerSentinel-v3.7.1.zip \
            META-INF \
            action.sh \
            customize.sh \
            module.prop \
            service.sh \
            system \
            webroot \
            webui \
            update.json
          unzip -t PowerSentinel-v3.7.1.zip >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.7.1 PowerSentinel-v3.7.1.zip \
            --title 'PowerSentinel v3.7.1' \
            --notes 'PowerSentinel identity migration release. The package is fully detached from the legacy XtremeBS naming while preserving GPLv3 licensing and historical attribution.'
