name: PowerSentinel final validation

on:
  push:
    branches:
      - powersentinel/identity-migration

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, '[identity-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: powersentinel/identity-migration
          fetch-depth: 0

      - name: Finish remaining naming cleanup
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -e 'xtremebs' -e 'XtremeBS' -e 'XBS' -e 'Xbs' -e 'xbs' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            perl -pi -e \
              's#xtremebs#powersentinel#g; \
               s#XtremeBS#PowerSentinel#g; \
               s#XBS#PowerSentinel#g; \
               s#Xbs#PowerSentinel#g; \
               s#xbs#powersentinel#g' "${files[@]}"
          fi

      - name: Shell syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n action.sh customize.sh service.sh
          bash -n system/bin/PowerSentineld system/bin/PowerSentinelctl system/bin/PowerSentinelconf system/bin/PowerSentinel-writefile
          for f in webui/cgi-bin/*.cgi; do bash -n "$f"; done

      - name: Build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify no legacy runtime names remain
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'XtremeBS|XBSctl|XBSconf|XBS-writefile|Xtreme-Battery-Saver|Xtreme Battery Saver|xtremebs-webui' -- ':!docs/webui-x-migration.md'; then
            echo 'Legacy identity tokens remain in tracked text files.'
            exit 1
          fi

      - name: Commit final migration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PowerSentinel migration bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/finalize.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[identity-migration] finalize naming and validation'
          git push origin powersentinel/identity-migration
