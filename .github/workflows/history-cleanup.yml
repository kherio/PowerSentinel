name: Rewrite history to remove legacy contributor identities

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rewrite legacy identities and messages
        env:
          TARGET_EMAIL_1: dethbyte777@gmail.com
          TARGET_EMAIL_2: 86263062+vikasmistry@users.noreply.github.com
          NEW_NAME: kherio
          NEW_EMAIL: kherio@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"

          # Commit the removal first so filter-branch has a clean worktree.
          rm -f .github/workflows/history-cleanup.yml
          git add -u .github/workflows/history-cleanup.yml
          git commit -m 'chore: remove one-shot history cleanup workflow'

          FILTER_ENV=''
          FILTER_ENV+='if [ "$GIT_AUTHOR_EMAIL" = "$TARGET_EMAIL_1" ] || [ "$GIT_AUTHOR_EMAIL" = "$TARGET_EMAIL_2" ]; then '
          FILTER_ENV+='GIT_AUTHOR_NAME="$NEW_NAME"; GIT_AUTHOR_EMAIL="$NEW_EMAIL"; fi; '
          FILTER_ENV+='if [ "$GIT_COMMITTER_EMAIL" = "$TARGET_EMAIL_1" ] || [ "$GIT_COMMITTER_EMAIL" = "$TARGET_EMAIL_2" ]; then '
          FILTER_ENV+='GIT_COMMITTER_NAME="$NEW_NAME"; GIT_COMMITTER_EMAIL="$NEW_EMAIL"; fi; '
          export FILTER_ENV

          FILTER_MSG='sed -e "s/DethByte64/kherio/g" -e "s/vikasmistry/kherio/g"'
          export FILTER_MSG

          git filter-branch -f --env-filter "$FILTER_ENV" --msg-filter "$FILTER_MSG" --tag-name-filter cat -- main powersentinel/identity-migration

          # The backup branch is intentionally untouched and is not pushed by
          # this workflow, so the pre-cleanup history remains recoverable.
          if git log main powersentinel/identity-migration --format='%an <%ae>%n%cn <%ce>%n%B' | grep -Eiq 'DethByte64|vikasmistry|dethbyte777@gmail\.com|86263062\+vikasmistry@users\.noreply\.github\.com'; then
            echo 'Legacy identity remains in rewritten branch history.'
            exit 1
          fi

          git push origin --force refs/heads/main:refs/heads/main
          git push origin --force refs/heads/powersentinel/identity-migration:refs/heads/powersentinel/identity-migration
          git push origin --force --tags
