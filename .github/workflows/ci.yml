name: CI

# Runs both test suites on every push/PR to main - catches a
# regression at the point it's introduced, rather than only at
# release.yml's own test job when someone finally tags a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jsdom 30 (frontend devDependency) pulls in undici >=8, whose
      # webidl shim calls node:worker_threads.markAsUncloneable - a
      # function that only exists from Node ~22.22.2 onward. Node 20
      # crashes at "require(jsdom)" with "markAsUncloneable is not a
      # function" before any test even runs (confirmed: this exact CI
      # job failed that way on Node 20). Do not downgrade this without
      # also pinning jsdom back to <30.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend test suite (bash)
        run: bash tests/run.sh

      - name: Frontend test suite (node)
        run: node tests/frontend/run.mjs
