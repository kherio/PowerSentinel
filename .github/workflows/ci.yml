name: CI

# Runs both test suites on every push/PR to main - catches a
# regression at the point it's introduced, rather than only at
# release.yml's own test job when someone finally tags a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend test suite (bash)
        run: bash tests/run.sh

      - name: Frontend test suite (node)
        run: node tests/frontend/run.mjs
