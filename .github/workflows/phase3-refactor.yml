name: PowerSentinel Phase 3 refactor

on:
  push:
    paths:
      - '.github/phase3-trigger'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract detector and event manager
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('system/bin/PowerSentineld')
          s = p.read_text()
          s = s.replace('declare -a active_events\n', '', 1)
          ranges = [
              ('is_device() {', 'ensure_ctl_file() {'),
              ('get_night_times() {', 'is_night_now() {'),
              ('is_night_now() {', '# Independent, temperature-based profile'),
              ('get_thermal_threshold() {', 'is_thermal_now() {'),
              ('is_thermal_now() {', '# Optional charge limiter'),
              ('is_event_locked() {', 'handle_event() {'),
              ('handle_event() {', 'init_v2() {'),
          ]
          for start, end in ranges:
              a = s.index(start)
              b = s.index(end, a)
              s = s[:a] + s[b:]
          assert '. "$(dirname "$0")/PowerSentinel-events.sh"' in s

          a = s.index('init_v2() {')
          b = s.index('init_v1() {', a)
          new = '''init_v2() {
  events_initialize

  while true; do

    # Check for command
    cmd="$(cat $ctl_file)"
    cmd_event=$(echo "$cmd" | cut -d' ' -f2)
    cmd=$(echo "$cmd" | cut -d' ' -f1)
    echo > "$ctl_file"
    case $cmd in
      reload)
        # reload is for top level config opts
        for i in ${!active_events[@]}; do
          handle_event "${active_events[$i]}" 0
        done
        log_msg 2 "Reloading the config"
        exec "$0"
        ;;
      start)
        if [ ! "$cmd_event" ]; then
          log_msg 1 "The start command was received. Starting manual event"
          handle_event manual 1
        else
          log_msg 1 "The start command was received. Attempting to start $cmd_event"
          handle_event "$cmd_event" 1
        fi
        ;;
      stop)
        if [ ! "$cmd_event" ]; then
          log_msg 1 "The stop command was received. Stopping manual event"
          handle_event manual 0
        else
          log_msg 1 "The stop command was received. Attempting to start $cmd_event"
          for i in ${!active_events[@]}; do
            if [ "${active_events[$i]}" = "$cmd_event" ]; then
              handle_event "${active_events[$i]}" 0
            fi
          done
        fi
        ;;
      pause)
        until [ "$resume" = "resume" ]; do
          sleep "$delay"
          resume="$(cat $ctl_file)"
        done ;;
      safe)
        log_msg 1 "Entered Safe Mode"
        echo "safemode=1" >> "$conf"
        for i in ${!active_events[@]}; do
          handle_event "${active_events[$i]}" 0
        done
        for pkg in $(pm list packages | cut -d: -f2-); do
          pm unsuspend "$pkg"
        done
        notif "Safe Mode is Active"
        until [ "$ready" = "resume" ]; do
          ready="$(cat $ctl_file)"
        done
        log_msg 1 "Resume command received. Safe Mode Exited."
        sed -i '/safemode=1/d' "$conf"
        exec "$0"
        ;;
      *)
        :
        ;;
    esac

    events_poll
    check_charge_limit

    sleep "$delay"
  done
}

'''
          s = s[:a] + new + s[b:]
          p.write_text(s)
          PY
          bash -n system/bin/PowerSentineld
          bash -n system/bin/PowerSentinel-events.sh
          grep -q '^events_initialize() {' system/bin/PowerSentinel-events.sh
          grep -q '^events_poll() {' system/bin/PowerSentinel-events.sh
          grep -q '^handle_event() {' system/bin/PowerSentinel-events.sh
          ! grep -q '^handle_event() {' system/bin/PowerSentineld
          ! grep -q '^is_device() {' system/bin/PowerSentineld
          git diff --check
      - name: Cleanup and commit
        shell: bash
        run: |
          rm -f .github/phase3-trigger .github/workflows/phase3-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/bin/PowerSentineld system/bin/PowerSentinel-events.sh .github/workflows
          git commit -m 'refactor(events): extract detector and event manager'
          git push
