name: PowerSentinel identity migration

on:
  push:
    branches:
      - powersentinel/identity-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, '[identity-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: powersentinel/identity-migration
          fetch-depth: 0

      - name: Apply repository-wide identity migration
        shell: bash
        run: |
          set -euo pipefail

          if [ -f XtremeBS.zip ]; then
            git rm -- XtremeBS.zip
          fi

          if [ ! -e system/bin/PowerSentinelctl ]; then
            git show origin/main:system/bin/XBSctl > system/bin/PowerSentinelctl
            chmod 0755 system/bin/PowerSentinelctl
          fi
          if [ ! -e system/bin/PowerSentinelconf ]; then
            git show origin/main:system/bin/XBSconf > system/bin/PowerSentinelconf
            chmod 0755 system/bin/PowerSentinelconf
          fi

          [ ! -e system/bin/XtremeBSd ] || git mv system/bin/XtremeBSd system/bin/PowerSentineld
          [ ! -e system/bin/XBS-writefile ] || git mv system/bin/XBS-writefile system/bin/PowerSentinel-writefile
          [ ! -e system/bin/XBSctl ] || git mv system/bin/XBSctl system/bin/PowerSentinelctl
          [ ! -e system/bin/XBSconf ] || git mv system/bin/XBSconf system/bin/PowerSentinelconf

          mapfile -t files < <(git grep -Il -e 'Xtreme-Battery-Saver' -e 'Xtreme Battery Saver' -e 'XtremeBS' -e 'XBSctl' -e 'XBSconf' -e 'XBS-writefile' -e 'XBSd' -e 'XBS' -e 'Xbs' -e 'xbs-locale-override' -e 'xbs' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            perl -pi -e \
              's#kherio/Xtreme-Battery-Saver#kherio/PowerSentinel#g; \
               s#Xtreme-Battery-Saver#PowerSentinel#g; \
               s#Xtreme Battery Saver#PowerSentinel#g; \
               s#XBS-writefile#PowerSentinel-writefile#g; \
               s#XBSctl#PowerSentinelctl#g; \
               s#XBSconf#PowerSentinelconf#g; \
               s#XBSd#PowerSentineld#g; \
               s#XtremeBS#PowerSentinel#g; \
               s#Xbs#PowerSentinel#g; \
               s#XBS#PowerSentinel#g; \
               s#xbs-locale-override#powersentinel-locale-override#g; \
               s#xbs#powersentinel#g' "${files[@]}"
          fi

          # git grep only sees tracked files; explicitly process files created
          # above from origin/main so their legacy identity is also migrated.
          perl -pi -e \
            's#kherio/Xtreme-Battery-Saver#kherio/PowerSentinel#g; \
             s#Xtreme-Battery-Saver#PowerSentinel#g; \
             s#Xtreme Battery Saver#PowerSentinel#g; \
             s#XBS-writefile#PowerSentinel-writefile#g; \
             s#XBSctl#PowerSentinelctl#g; \
             s#XBSconf#PowerSentinelconf#g; \
             s#XBSd#PowerSentineld#g; \
             s#XtremeBS#PowerSentinel#g; \
             s#Xbs#PowerSentinel#g; \
             s#XBS#PowerSentinel#g; \
             s#xbs-locale-override#powersentinel-locale-override#g; \
             s#xbs#powersentinel#g' \
            system/bin/PowerSentinelctl system/bin/PowerSentinelconf

          if [ -f module.prop ]; then
            sed -i 's/^id=XtremeBS$/id=PowerSentinel/; s/^name=Xtreme Battery Saver$/name=PowerSentinel/; s/^author=kherio (fork of DethByte64\/Xtreme-Battery-Saver)$/author=kherio/' module.prop
          fi

          git config user.name 'PowerSentinel migration bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/identity-migration.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[identity-migration] complete PowerSentinel identity cleanup'
          git push origin powersentinel/identity-migration
